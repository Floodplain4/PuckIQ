<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PuckIQ | NHL Matchup Intelligence</title><link rel="stylesheet" href="{{ url_for('static', path='style.css') }}"><style>body{background:#f4f7fb;color:#152338}header{background:#10233d;color:white;padding:25px max(20px,calc((100% - 1100px)/2))}header h1{color:white;margin:0}header p{color:#d2e2f4}main{max-width:1100px;margin:30px auto;padding:0 20px}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}.game{border:1px solid #dbe4f1;background:white;border-radius:18px;padding:20px;box-shadow:0 5px 20px #142c4910}.teams{display:flex;justify-content:space-around;align-items:center;text-align:center;gap:12px}.team{flex:1}.team img{height:70px;width:70px;object-fit:contain}.team strong{display:block;margin:8px 0}.vs{font-weight:bold;color:#7b8ca0}.meta{color:#536780;font-size:.9rem;margin-bottom:18px}input,button{padding:9px;border-radius:8px;border:1px solid #b9c8db}button{background:#174a83;color:white;cursor:pointer}footer{text-align:center;color:#60738b;padding:35px} .matchup-link{display:block;margin-top:18px;text-decoration:none;font-weight:700;color:#174a83}.back-link{display:inline-block;margin-bottom:18px;color:#174a83;text-decoration:none}.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.1em;color:#60738b}.matchup-heading h2{margin-bottom:6px}.matchup-hero{display:flex;align-items:center;justify-content:space-around;background:white;border:1px solid #dbe4f1;border-radius:18px;padding:25px;gap:20px;margin:20px 0}.hero-team{text-align:center;flex:1}.hero-team img{width:90px;height:90px;object-fit:contain}.hero-team h3{margin:8px 0}.hero-team span{display:block;color:#60738b}.hero-score{display:block;font-size:2rem;margin-top:8px}.analytics-card{background:white;border:1px solid #dbe4f1;border-radius:16px;padding:22px;margin:18px 0;min-width:0}.analytics-card h3{margin-top:0}.comparison-row{dis
